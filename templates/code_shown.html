{% extends "base.html" %}
{% block title %}복귀 코드 · KR-AV Ethics{% endblock %}
{% block content %}
<div class="container-narrow">
  <span class="eyebrow" style="text-align:center;">SAVE THIS NOW</span>
  <h1 style="text-align:center; font-size:30px;">이 코드를 저장해두세요</h1>
  <p style="text-align:center; margin-bottom:20px;">
    이 화면을 벗어나면 다시 확인할 수 없습니다. 저희는 이 코드의 원문을 저장하지 않으므로,
    분실 시 이전 참여 기록에는 접근할 수 없습니다 (개인정보가 없기 때문에 복구가 불가능합니다).
  </p>
  <div class="card" style="text-align:center;">
    <div style="font-family:var(--font-mono); font-size:26px; letter-spacing:1px; color:var(--teal); padding:20px 0;">
      {{ recovery_code }}
    </div>
    <a href="{{ url_for('mainpage') }}" class="btn" style="display:inline-block; width:auto; padding:14px 28px;">저장했습니다, 계속하기 →</a>
  </div>
</div>
{% endblock %}
